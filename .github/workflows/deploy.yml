name: Deploy to Firebase (Secure)

on:
  push:
    branches:
      - main
      - 'release/*'
      - 'feature/*'
      - 'claude/*'
  pull_request:
    branches:
      - main
  # General-purpose manual trigger — e.g. re-running `verify` by hand without
  # a new commit. Not load-bearing for the docs-only case below (that's now
  # handled automatically by the `changes` job), but still useful on its own.
  workflow_dispatch:

# Cancel a superseded run on the same branch/PR (e.g. a quick sequence of
# fixup pushes) instead of letting redundant verify+deploy runs pile up and
# burn CI minutes in parallel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- JOB 0: CHANGE DETECTION ---
  # Replaces the old trigger-level `paths-ignore` on push/pull_request. That
  # approach saved CI cost the same way this does, but had a fatal flaw: when
  # a PR's diff was entirely within the ignored paths, `verify` never ran at
  # all — and the branch ruleset requires `verify` as a status check with
  # zero bypass actors, so a pure-docs PR became structurally unmergeable
  # (hit for real on PR #214/#216). GitHub's own docs confirm this is a known
  # class of problem with path-filtered required checks and recommend a
  # second workflow reporting the same check name — but that requires
  # hand-keeping a duplicate step list in sync forever. Computing the same
  # decision here, inside the one workflow, and gating each `verify` step on
  # it instead avoids that duplication while getting the same properties:
  # `verify` always reports a real result, and the expensive steps still
  # only run for changes that could actually need them.
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Path-filtering here needs to diff against a base commit that a
          # shallow (depth-1) checkout won't have.
          fetch-depth: 0

      - name: Determine whether this change is confined to docs-only paths
        id: filter
        run: |
          set -euo pipefail

          # Mirrors the old paths-ignore list exactly — anything NOT matched
          # here can't affect the app build, the Cloud Functions runtime, or
          # anything the test suites exercise. Deliberately NOT docs-site/**
          # or a blanket **/*.md: GATE 3b below (Docs Site Build) exists
          # specifically to catch a broken docs-site build before merge (see
          # e1616ca), and a guide page is plain markdown too.
          IGNORE_PATTERN='^(docs/|_raw_screenshots/|CLAUDE\.md$|GEMINI\.md$|README\.md$|\.claude/)'

          case "${{ github.event_name }}" in
            pull_request)
              BASE="${{ github.event.pull_request.base.sha }}"
              ;;
            push)
              BASE="${{ github.event.before }}"
              # A new branch's first push (or a history-losing force-push) has
              # no comparable prior commit — fail open to the full pipeline
              # rather than guess.
              if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
                echo "docs_only=false" >> "$GITHUB_OUTPUT"
                echo "No comparable base commit for this push — running the full pipeline."
                exit 0
              fi
              ;;
            *)
              # workflow_dispatch: a manual run is asking for the real thing.
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          CHANGED_FILES=$(git diff --name-only "$BASE" "${{ github.sha }}")
          echo "Changed files:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -qvE "$IGNORE_PATTERN"; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

  # --- JOB 1: QUALITY GATES ---
  verify:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      # Docs-only fast path: everything below this step is gated to skip when
      # `changes` found nothing outside the ignored paths — none of it can be
      # affected by a docs-only change. This is the one check that still
      # applies (docs/projects/*.md must keep matching 00_TEMPLATE.md's
      # required sections) and is cheap enough (no npm install — the script
      # only uses node:fs) to just always run here.
      - name: Spec Quality Check (docs-only fast path)
        if: needs.changes.outputs.docs_only == 'true'
        run: node scripts/check_spec_quality.mjs

      - name: Install
        if: needs.changes.outputs.docs_only != 'true'
        run: npm ci

      # GATE 1: Production Dependency Vulnerability Audit (PROJ-96)
      # --omit=dev scopes this to deps that actually ship, not dev tooling
      # (eslint/jest/etc. carry their own long tail of accepted-risk, non-forceable
      # advisories tracked separately — see docs/projects/90_SECURITY_COMPLIANCE_HARDENING.md).
      # Threshold is `critical` (not `high`) because of one known, documented,
      # non-forceable exception: react-router's RSC-Mode CSRF advisory
      # (GHSA-qwww-vcr4-c8h2) — this app never uses React Router's RSC/framework
      # mode (no createBrowserRouter/RouterProvider, just component-based Routes),
      # and the only real fix is an untested v7->v8 major bump, out of scope here.
      # See docs/projects/96_CI_DEPLOY_SAFETY_NET.md for the full reasoning.
      # `npm audit` still prints this (and anything else) to the CI log regardless
      # of --audit-level, so it stays visible — it just won't block the build.
      #
      # `npm audit`'s advisories-bulk call to registry.npmjs.org has a track record
      # of transient 503s that fail this step before any other gate even runs,
      # independent of the PR's actual diff — retry with backoff rather than let a
      # registry outage block every PR until someone notices and re-runs manually.
      - name: Dependency Vulnerability Audit (root, production deps)
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          for attempt in 1 2 3; do
            npm audit --omit=dev --audit-level=critical && exit 0
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "npm audit attempt $attempt/3 failed — retrying in $((attempt * 15))s (registry.npmjs.org's advisories endpoint is known to 503 transiently)" >&2
            sleep $((attempt * 15))
          done

      # GATE 2: Linting (Code Style)
      - name: Lint Check
        if: needs.changes.outputs.docs_only != 'true'
        run: npm run lint

      # GATE 3: Spec Quality (docs/projects/*.md must match the governance skill's Check F)
      - name: Spec Quality Check
        if: needs.changes.outputs.docs_only != 'true'
        run: npm run docs:check-specs

      # GATE 3b: Docs Site Build — the deploy-docs.yaml workflow only runs
      # `npm run docs:build` on push to main (after merge), so a broken
      # docs-site build was never actually blocking a PR. That's how a stale
      # screenshot reference broke the build once already (see e1616ca) and
      # went unnoticed until a follow-up hotfix. Building it here catches
      # that class of regression before merge instead of after.
      - name: Docs Site Build
        if: needs.changes.outputs.docs_only != 'true'
        run: npm run docs:build

      # GATE 4: Unit Tests (Logic)
      - name: Unit Tests
        if: needs.changes.outputs.docs_only != 'true'
        run: npm run test:once

      # GATE 5: Cloud Functions Unit Tests (separate npm workspace, own vitest config)
      - name: Install Functions dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: npm ci --prefix functions

      - name: Functions Unit Tests
        if: needs.changes.outputs.docs_only != 'true'
        run: npm test --prefix functions

      # GATE 6: Production Dependency Vulnerability Audit (functions/, PROJ-96)
      # functions/ is the actually-deployed Cloud Functions runtime, audited
      # separately from root because it's a distinct npm workspace with its
      # own lockfile.
      # Same registry-flake retry as the root audit above — this hits the same
      # registry.npmjs.org advisories-bulk endpoint from a separate npm workspace.
      - name: Dependency Vulnerability Audit (functions, production deps)
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          for attempt in 1 2 3; do
            npm audit --prefix functions --omit=dev --audit-level=high && exit 0
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "npm audit attempt $attempt/3 failed — retrying in $((attempt * 15))s (registry.npmjs.org's advisories endpoint is known to 503 transiently)" >&2
            sleep $((attempt * 15))
          done

      # GATE 7: E2E Golden Paths (PROJ-23) and Firestore/Storage Rules Tests
      # (PROJ-99, PROJ-113) both need Firebase emulators — shared Java setup,
      # run rules tests first since they're much faster and should fail fast
      # before the slower Playwright suite. Firestore and Storage rules tests
      # share one `firebase emulators:exec` session (one Java/emulator boot)
      # rather than the two separate ones `npm run test:rules` and
      # `npm run test:rules:storage` each start on their own when run
      # individually (still the right way to run just one locally) — emulators
      # are started/torn down automatically, so this never touches a real
      # Firebase project.
      - name: Setup Java (required by the Firestore/Storage emulators)
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Firestore & Storage Rules Tests (PROJ-99, PROJ-113)
        if: needs.changes.outputs.docs_only != 'true'
        run: npx firebase-tools emulators:exec --project=mrt2-app-dev --only firestore,storage "npx vitest run --config vitest.rules.config.ts && npx vitest run --config vitest.rules.storage.config.ts"

      - name: Install Playwright browsers
        if: needs.changes.outputs.docs_only != 'true'
        run: npx playwright install --with-deps chromium

      # PROJ-117: `npm run lint` uses tseslint's non-type-checked recommended
      # config, and Vitest transforms TypeScript per-file via esbuild with no
      # cross-file type checking — so before this step, nothing in `verify`
      # actually ran `tsc -b`. A real type error (missing prop, wrong
      # signature, Firestore doc shape mismatch) could pass lint, pass every
      # unit test, pass e2e, and merge clean, only to be caught when the
      # `deploy` job's own `npm run build` ran post-merge on `main`. Reuses
      # the Chromium install above (scripts/prerender-public-routes.mjs needs
      # it) rather than installing a second time — confirmed locally that the
      # build's prerender step needs no Firebase emulator (it renders 4
      # public routes against a local `vite preview`, no Auth/Firestore
      # dependency), so this has no emulator-ordering constraint.
      - name: Build (type-check + production build + prerender)
        if: needs.changes.outputs.docs_only != 'true'
        run: npm run build

      # PROJ-73: the Functions emulator (now included in test:e2e's --only
      # list, so vault.spec.ts actually exercises verifyVaultPin instead of
      # silently falling back to the pre-PROJ-65 unpeppered derivation) needs
      # a local value for every defineSecret() the codebase declares, or it
      # blocks waiting for interactive input. Placeholder only — never the
      # real Secret Manager values used at actual deploy time.
      - name: Write emulator-only secret placeholders
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          echo "GEMINI_API_KEY=emulator-placeholder-not-a-real-key" >> functions/.secret.local
          echo "VAULT_PEPPER=emulator-placeholder-not-a-real-pepper" >> functions/.secret.local

      - name: E2E Golden Paths
        if: needs.changes.outputs.docs_only != 'true'
        run: npm run test:e2e
        env:
          # The verify job never runs the deploy job's "Set Env" steps, so
          # without these the dev server's Firebase SDK has no apiKey/projectId
          # and initializeApp() fails before signup can ever redirect anywhere
          # — every golden path hangs on the same waitForURL and times out.
          # These are the same mrt2-app-dev *public* client values already
          # committed in .env.example (Firebase web config is not a secret;
          # it's guarded by Firestore rules, not by hiding this key) — and
          # VITE_USE_EMULATORS=true means none of it ever reaches the real
          # project anyway, only the local emulators this job starts.
          VITE_FIREBASE_API_KEY: AIzaSyDXkubt0IkWv_-3m7YAZxEGGgJoN3jOvS0
          VITE_FIREBASE_AUTH_DOMAIN: mrt2-app-dev.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: mrt2-app-dev
          VITE_FIREBASE_STORAGE_BUCKET: mrt2-app-dev.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "1040431613138"
          VITE_FIREBASE_APP_ID: "1:1040431613138:web:e0e613ab8551f74d48590b"

      # PROJ-117: this is the regression test for SEC-01 (PROJ-90) — a real,
      # previously-shipped production auth-bypass. It was written specifically
      # because the golden-path suite above runs against `npm run dev` (where
      # import.meta.env.DEV is always true) and would pass even if the SEC-01
      # fix were reverted. It existed but was never wired into this workflow
      # until now — see docs/reports/2026-09_testing_strategy_gap_analysis.md
      # §2.2. Self-contained: playwright.security.config.ts's own webServer
      # builds and serves a real production bundle, no Firebase emulators or
      # env vars needed (the only assertion is an unauthenticated redirect to
      # /login).
      - name: E2E Security Regression (SEC-01)
        if: needs.changes.outputs.docs_only != 'true'
        run: npm run test:e2e:security

  # --- JOB 2: BUILD & DEPLOY (Only if Verify passes) ---
  # Guarded to push events only — a pull_request run has github.ref pointing at the
  # PR's synthetic merge ref (refs/pull/N/merge), which matches none of the three
  # Set Env conditions below, so every FIREBASE_PROJECT_ID/secret would resolve to an
  # empty string and this job would attempt a real `firebase deploy` with no target.
  # PRs only need the verify job as a required check; deploys stay tied to actual
  # branch pushes (feature/*, claude/*, release/*, main).
  #
  # docs_only != 'true' restores the same skip-deploy-for-docs-only-pushes
  # behavior the old trigger-level paths-ignore provided — now driven by the
  # `changes` job's git-diff-based detection instead of GitHub's own path
  # matching, since that's the only source of truth this workflow has left.
  deploy:
    needs: [changes, verify]
    if: github.event_name == 'push' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Initialize empty vars to satisfy linter
    env:
      FIREBASE_PROJECT_ID: ""
      # Standard Vite Env Vars
      VITE_FIREBASE_API_KEY: ""
      VITE_FIREBASE_AUTH_DOMAIN: ""
      VITE_FIREBASE_PROJECT_ID: ""
      VITE_FIREBASE_STORAGE_BUCKET: ""
      VITE_FIREBASE_MESSAGING_SENDER_ID: ""
      VITE_FIREBASE_APP_ID: ""
      VITE_GEMINI_API_KEY: ""
      VITE_STRIPE_PREMIUM_PRICE_ID: ""
      VITE_FIREBASE_VAPID_KEY: "" # <-- ADDED FOR PUSH NOTIFICATIONS

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install
        run: npm ci

      # --- ENVIRONMENT SELECTION ---
      
      # DEV (Feature Branches + Claude Code session branches)
      - name: Set Env (DEV)
        if: startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/claude/')
        run: |
          echo "FIREBASE_PROJECT_ID=mrt2-app-dev" >> $GITHUB_ENV
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY_DEV }}" >> $GITHUB_ENV
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN_DEV }}" >> $GITHUB_ENV
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID_DEV }}" >> $GITHUB_ENV
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET_DEV }}" >> $GITHUB_ENV
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID_DEV }}" >> $GITHUB_ENV
          echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID_DEV }}" >> $GITHUB_ENV
          echo "VITE_GEMINI_API_KEY=${{ secrets.VITE_GEMINI_API_KEY }}" >> $GITHUB_ENV
          echo "VITE_STRIPE_PREMIUM_PRICE_ID=${{ secrets.VITE_STRIPE_PREMIUM_PRICE_ID }}" >> $GITHUB_ENV
          echo "VITE_FIREBASE_VAPID_KEY=${{ secrets.VITE_FIREBASE_VAPID_KEY_DEV }}" >> $GITHUB_ENV
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV_BASE64 }}" | base64 -d > ./service-account.json

      # UAT (Release Branches)
      - name: Set Env (UAT)
        if: startsWith(github.ref, 'refs/heads/release/')
        run: |
          echo "FIREBASE_PROJECT_ID=mrt2-app-uat" >> $GITHUB_ENV
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY_UAT }}" >> $GITHUB_ENV
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN_UAT }}" >> $GITHUB_ENV
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID_UAT }}" >> $GITHUB_ENV
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET_UAT }}" >> $GITHUB_ENV
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID_UAT }}" >> $GITHUB_ENV
          echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID_UAT }}" >> $GITHUB_ENV
          echo "VITE_GEMINI_API_KEY=${{ secrets.VITE_GEMINI_API_KEY }}" >> $GITHUB_ENV
          echo "VITE_STRIPE_PREMIUM_PRICE_ID=${{ secrets.VITE_STRIPE_PREMIUM_PRICE_ID }}" >> $GITHUB_ENV
          echo "VITE_FIREBASE_VAPID_KEY=${{ secrets.VITE_FIREBASE_VAPID_KEY_UAT }}" >> $GITHUB_ENV
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_UAT_BASE64 }}" | base64 -d > ./service-account.json

      # PROD (Main Branch)
      - name: Set Env (PROD)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "FIREBASE_PROJECT_ID=mrt2-app-prod" >> $GITHUB_ENV
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY_PROD }}" >> $GITHUB_ENV
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN_PROD }}" >> $GITHUB_ENV
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID_PROD }}" >> $GITHUB_ENV
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET_PROD }}" >> $GITHUB_ENV
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID_PROD }}" >> $GITHUB_ENV
          echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID_PROD }}" >> $GITHUB_ENV
          echo "VITE_GEMINI_API_KEY=${{ secrets.VITE_GEMINI_API_KEY }}" >> $GITHUB_ENV
          echo "VITE_STRIPE_PREMIUM_PRICE_ID=${{ secrets.VITE_STRIPE_PREMIUM_PRICE_ID }}" >> $GITHUB_ENV
          echo "VITE_FIREBASE_VAPID_KEY=${{ secrets.VITE_FIREBASE_VAPID_KEY_PROD }}" >> $GITHUB_ENV
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD_BASE64 }}" | base64 -d > ./service-account.json

      # --- BUILD & DEPLOY ---
      
      - name: Load Service Account
        id: load-service-account
        run: |
          # Mask every non-empty line (private_key, private_key_id, client_email, etc.)
          # BEFORE it's referenced anywhere — GitHub's automatic secret redaction only
          # catches the literal base64 secret; this file is a *decoded* derived value
          # it doesn't recognize on its own.
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              echo "::add-mask::$line"
            fi
          done < ./service-account.json
          # Step output (not $GITHUB_ENV) so this only reaches the one step that
          # consumes it below, instead of being broadcast as an env var into every
          # subsequent step's environment (and their logged env: debug blocks).
          EOF_DELIM="EOF_$(openssl rand -hex 8)"
          echo "service_account_json<<$EOF_DELIM" >> "$GITHUB_OUTPUT"
          cat ./service-account.json >> "$GITHUB_OUTPUT"
          echo "$EOF_DELIM" >> "$GITHUB_OUTPUT"

      # PROJ-102: `npm run build` now runs scripts/prerender-public-routes.mjs
      # as its final step, which launches headless Chromium via Playwright to
      # snapshot the 4 public routes — unlike the verify job above (which
      # installs this for E2E Golden Paths), this job never had a reason to
      # need a browser until the build step itself started depending on one.
      - name: Install Playwright Chromium (for build-time prerendering)
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          # Inject explicit Env Vars for Vite
          VITE_FIREBASE_API_KEY: ${{ env.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ env.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ env.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ env.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ env.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ env.VITE_FIREBASE_APP_ID }}
          VITE_GEMINI_API_KEY: ${{ env.VITE_GEMINI_API_KEY }}
          VITE_STRIPE_PREMIUM_PRICE_ID: ${{ env.VITE_STRIPE_PREMIUM_PRICE_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ env.VITE_FIREBASE_VAPID_KEY }}

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: "${{ steps.load-service-account.outputs.service_account_json }}"
          projectId: "${{ env.FIREBASE_PROJECT_ID }}"
          channelId: live

      # Hosting is the only thing action-hosting-deploy@v0 ships above — rules,
      # indexes, and Cloud Functions were never deployed by this pipeline and
      # could silently drift from what's in main. Deploy them explicitly here.
      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Deploy Firestore Rules, Indexes & Cloud Functions
        run: npx firebase-tools deploy --only firestore:rules,firestore:indexes,functions --project "${{ env.FIREBASE_PROJECT_ID }}" --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
